<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Open in Velvet</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 30%, #3a0d1c, #14060b 70%); color: #e8dccf; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; }
  main { padding: 32px; max-width: 420px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #b8a99c; margin: 0 0 24px; }
  a.btn { display: inline-block; padding: 12px 28px; border-radius: 999px; background: #e0234e; color: #fff; font-weight: 700; text-decoration: none; }
  a.btn:hover { filter: brightness(1.1); }
  small { display: block; margin-top: 28px; color: #8a7d72; }
  small a { color: #e8dccf; }
</style>
</head>
<body>
<main>
  <h1 id="title">Opening Velvet…</h1>
  <p id="text">Someone shared a song or playlist with you.</p>
  <a id="open" class="btn" href="#" hidden>Open in Velvet</a>
  <small>Don’t have Velvet yet? <a href="https://github.com/BugsReporter/velvet-releases/releases/latest" rel="noopener">Download it for Windows</a>, then open this link again.</small>
</main>
<script>
  // Velvet share links look like https://bugsreporter.github.io/velvetplayer/<id>/ (this page also answers as 404.html,
  // so any path lands here). The id goes to the Velvet app as velvet://share/<id>; nothing else is read or sent.
  const id = (location.pathname.match(/\/([a-f0-9]{20})\/?$/) || location.hash.match(/^#([a-f0-9]{20})$/) || [])[1];
  const open = document.getElementById('open');
  if (id) {
    open.href = 'velvet://share/' + id; open.hidden = false;
    location.href = open.href;
    setTimeout(() => { document.getElementById('title').textContent = 'Open it in Velvet'; }, 1500);
  } else {
    document.getElementById('title').textContent = 'This link isn’t complete';
    document.getElementById('text').textContent = 'Ask for the link again, or open Velvet.';
  }
</script>
</body>
</html>
